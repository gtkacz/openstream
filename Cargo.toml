[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
brp-proto = { path = "crates/proto" }
brp-codec = { path = "crates/codec" }
brp-capture = { path = "crates/capture" }
brp-audio = { path = "crates/audio" }
brp-net = { path = "crates/net" }
brp-pipeline = { path = "crates/pipeline" }
brp-room = { path = "crates/room" }
brp-update = { path = "crates/update" }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
postcard = { version = "1.1", features = ["alloc"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
iroh-base = { version = "1.1", features = ["key"] }
iroh = { version = "1.1", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-tickets = "1.0"
iroh-gossip = "0.101"
n0-future = "0.3"
rand = "0.10"
bytes = "1.12"
ffmpeg-sys-next = { version = "9.0", default-features = false, features = ["avcodec", "swscale"] }
ashpd = { version = "0.13", features = ["screencast"] }
pipewire = "0.10"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
data-encoding = "2.9"
winit = "0.30"
wgpu = "30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
windows-capture = "2.0"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Security_Authorization_AppCapabilityAccess",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
cpal = "0.18"
libc = "0.2"
wasapi = "0.24"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
sha2 = "0.11"
tar = "0.4"
flate2 = "1.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
