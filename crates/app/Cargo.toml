[package]
name = "brp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[[bin]]
name = "brp"
path = "src/main.rs"
[lib]
name = "brp_app"
path = "src/lib.rs"
[dependencies]
brp-proto.workspace = true
brp-codec.workspace = true
brp-capture.workspace = true
brp-net.workspace = true
brp-pipeline.workspace = true
brp-room.workspace = true
brp-audio.workspace = true
brp-update.workspace = true
iroh.workspace = true
iroh-tickets.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
clap.workspace = true
directories.workspace = true
data-encoding.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true
wgpu.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
bytemuck.workspace = true
ab_glyph.workspace = true

[build-dependencies]
embed-resource.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, features = ["settings"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["objc2-core-services"] }
objc2-core-foundation.workspace = true
