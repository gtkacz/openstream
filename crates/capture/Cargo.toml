[package]
name = "brp-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[dependencies]
brp-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
pipewire.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-capture.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-screen-capture-kit.workspace = true
objc2-app-kit.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
