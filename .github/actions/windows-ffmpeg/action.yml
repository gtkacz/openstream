name: Windows FFmpeg
description: LLVM for bindgen and the pinned BtbN LGPL shared FFmpeg build from this repository's mirror. Exports FFMPEG_DIR and LIBCLANG_PATH and puts the DLLs on PATH.
runs:
  using: composite
  steps:
    - name: Ensure LLVM for bindgen
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $libclang = "C:\Program Files\LLVM\bin"
        if (-not (Test-Path "$libclang\libclang.dll")) {
          # choco is a native command: the error preference does not see its exit code.
          choco install llvm -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        Add-Content $env:GITHUB_ENV "LIBCLANG_PATH=$libclang"
    - name: Install FFmpeg (BtbN LGPL shared, mirrored and checked)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        # Mirrored because BtbN deletes old builds. The hash is what ends up in every release.
        $release = "ffmpeg-n8.1.3-32-g760d10603e"
        $asset = "ffmpeg-n8.1.3-32-g760d10603e-win64-lgpl-shared-8.1.zip"
        $dir = Join-Path $env:GITHUB_WORKSPACE "ffmpeg"
        Invoke-WebRequest -Uri "https://github.com/gtkacz/openstream/releases/download/$release/$asset" -OutFile ffmpeg.zip
        if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash -ne "a8d0a12a76f5820456f5a60dbfe1bbf782cf4daa93a1e594a8da8172150992a9") {
          throw "ffmpeg.zip does not match its pinned hash"
        }
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
        Move-Item (Get-ChildItem ffmpeg-extract | Select-Object -First 1).FullName $dir
        Add-Content $env:GITHUB_ENV "FFMPEG_DIR=$dir"
        Add-Content $env:GITHUB_PATH "$dir\bin"
