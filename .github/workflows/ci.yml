name: ci
on:
  push:
    branches: [main]
  pull_request:
# These jobs run every dependency's build script, and none of them needs to write.
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False git gcc gcc-c++ clang clang-devel xz
          pkgconf-pkg-config pipewire-devel libxkbcommon-devel wayland-devel libX11-devel
          alsa-lib-devel
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/linux-ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p brp
        env:
          # Same rpath as the release job: the artifact must load the FFmpeg libraries staged beside it.
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,--disable-new-dtags
      - name: Stage the artifact
        run: ./ci/stage-linux.sh dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brp-linux-x86_64
          path: dist
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/windows-ffmpeg
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p brp
      - name: Stage the artifact
        shell: pwsh
        run: ./ci/stage-windows.ps1 -Destination dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brp-windows-x86_64
          path: dist
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/macos-ffmpeg
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # Test binaries load the FFmpeg dylibs straight from the build, by their @rpath names.
          RUSTFLAGS: -C link-arg=-Wl,-rpath,${{ env.FFMPEG_DIR }}/lib
      - run: cargo build --release -p brp
        env:
          # Same rpath as the release job: the binary loads the libraries staged beside it.
          RUSTFLAGS: -C link-arg=-Wl,-rpath,@executable_path
      - name: Stage the artifact
        run: ./ci/stage-macos.sh dist/brp dist/OpenStream.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brp-macos-aarch64
          path: dist
  release:
    needs: [linux, windows, macos]
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
