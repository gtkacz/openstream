name: release
on:
  # Called as the last job of CI, so only what passed reaches users: the app never downgrades, so a
  # bad release can only be replaced by a newer one.
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: Existing workspace version to release (for example, 1.0.0)
        required: true
        type: string
# Write access only where the jobs use it: the build jobs run every dependency's build script.
# No caches either, because a cache written by any job on main could change what ships.
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.bump.outputs.should_release }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - id: bump
        name: Prepare an automatic or explicitly requested release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          message="$(git log -1 --pretty=%s)"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "manual releases must run from main" >&2
              exit 1
            fi
            version="$RELEASE_VERSION"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "requested version is not plain semver: $version" >&2
              exit 1
            fi
            current="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "brp") | .version')"
            if [[ "$version" != "$current" ]]; then
              echo "requested version $version does not match workspace version $current" >&2
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "tag v$version already exists" >&2
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "Release v$version" -m "Explicitly requested release of v$version from main."
            git push origin "v$version"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CI passed for this commit, but a newer one may have landed since; its own run decides.
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$message" == fix:* || "$message" == 'chore(release):'* ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "brp") | .version')"
          if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "workspace version is not a plain semver release: $current" >&2
            exit 1
          fi
          next="${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1)).0"
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$next\"/" Cargo.toml
          cargo metadata --no-deps --format-version 1 >/dev/null
          NEXT="$next" perl -0pi -e 's/(^name = "brp(?:-[^\"]+)?"\nversion = ")[^\"]+/$1$ENV{NEXT}/mg' Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v$next"
          tag="v$next"
          git tag -a "$tag" -m "Release $tag" -m "$message"
          git push origin HEAD:main
          git push origin "$tag"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
  linux:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False git gcc gcc-c++ clang clang-devel xz
          pkgconf-pkg-config pipewire-devel libxkbcommon-devel wayland-devel libX11-devel
          alsa-lib-devel
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/linux-ffmpeg
      - run: cargo build --release --locked -p brp
        env:
          # $ORIGIN makes the binary load the FFmpeg libraries staged beside it. DT_RPATH rather
          # than RUNPATH because libswresample is reached only through libavcodec, and RUNPATH
          # does not govern that transitive lookup.
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,--disable-new-dtags
      - name: Stage the tarball
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          name="brp-$VERSION-linux-x86_64"
          ./ci/stage-linux.sh "dist/$name"
          # ustar and no copyfile metadata: bsdtar would otherwise add AppleDouble `._` members,
          # which the updater would copy into the install, and pax xattr headers.
          COPYFILE_DISABLE=1 tar --format ustar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/*.tar.gz
  windows:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/windows-ffmpeg
      - run: cargo build --release --locked -p brp
      - name: Stage the zip
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "brp-$env:VERSION-windows-x86_64"
          ./ci/stage-windows.ps1 -Destination "dist\$name"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*.zip
  macos:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: ./.github/actions/macos-ffmpeg
        with:
          cache: "false"
      - run: cargo build --release --locked -p brp
        env:
          # @executable_path makes the binary load the libraries staged beside it, both in the
          # flat directory and in OpenStream.app/Contents/MacOS.
          RUSTFLAGS: -C link-arg=-Wl,-rpath,@executable_path
      - name: Stage the tarball and the app bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          name="brp-$VERSION-macos-aarch64"
          ./ci/stage-macos.sh "dist/$name" dist/OpenStream.app
          # The flat tarball is what an in-app update downloads; the zipped bundle is what a new
          # user drags to Applications. ditto keeps the bundle's signature and modes intact.
          # ustar and no copyfile metadata: bsdtar would otherwise add AppleDouble `._` members,
          # which the updater would copy into the install, and pax xattr headers.
          COPYFILE_DISABLE=1 tar --format ustar -C dist -czf "dist/$name.tar.gz" "$name"
          ditto -c -k --keepParent dist/OpenStream.app "dist/OpenStream-$VERSION-macos-aarch64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: |
            dist/*.tar.gz
            dist/*.zip
  publish:
    needs: [prepare, linux, windows, macos]
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes from the tag annotation
        run: |
          set -eu
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          tag="${{ needs.prepare.outputs.tag }}"
          git fetch --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
          git tag -l --format='%(contents)' "$tag" > notes.md
          [ -s notes.md ] || { echo "no annotation on $tag; use git tag -a" >&2; exit 1; }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          body_path: notes.md
