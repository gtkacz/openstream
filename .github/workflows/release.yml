name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.bump.outputs.should_release }}
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.bump.outputs.commit }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: bump
        name: Bump the minor version unless this is a fix
        run: |
          set -eu
          message="$(git log -1 --pretty=%s)"
          if [[ "$message" == fix:* || "$message" == 'chore(release):'* ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "brp") | .version')"
          if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "workspace version is not a plain semver release: $current" >&2
            exit 1
          fi
          next="${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1)).0"
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$next\"/" Cargo.toml
          cargo metadata --no-deps --format-version 1 >/dev/null
          NEXT="$next" perl -0pi -e 's/(^name = "brp(?:-[^\"]+)?"\nversion = ")[^\"]+/$1$ENV{NEXT}/mg' Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v$next"
          tag="v$next"
          git tag -a "$tag" -m "Release $tag" -m "$message"
          git push origin HEAD:main
          git push origin "$tag"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
  linux:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: >
          dnf install -y --setopt=install_weak_deps=False git gcc gcc-c++ clang clang-devel xz
          pkgconf-pkg-config pipewire-devel libxkbcommon-devel wayland-devel libX11-devel
          alsa-lib-devel
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/linux-ffmpeg
      - run: cargo build --release -p brp
        env:
          # $ORIGIN makes the binary load the FFmpeg libraries staged beside it. DT_RPATH rather
          # than RUNPATH because libswresample is reached only through libavcodec, and RUNPATH
          # does not govern that transitive lookup.
          RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,--disable-new-dtags
      - name: Stage the tarball
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          name="brp-$VERSION-linux-x86_64"
          ./ci/stage-linux.sh "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
  windows:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/windows-ffmpeg
      - run: cargo build --release -p brp
      - name: Stage the zip
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "brp-$env:VERSION-windows-x86_64"
          ./ci/stage-windows.ps1 -Destination "dist\$name"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
  publish:
    needs: [prepare, linux, windows]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes from the tag annotation
        run: |
          set -eu
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          tag="${{ needs.prepare.outputs.tag }}"
          git fetch --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
          git tag -l --format='%(contents)' "$tag" > notes.md
          [ -s notes.md ] || { echo "no annotation on $tag; use git tag -a" >&2; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/*
          body_path: notes.md
