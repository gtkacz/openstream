<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Join an OpenStream room</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  :root { --ground: #0a1017; --surface: #111a23; --raised: #1b2632; --highlight: #273544; --text: #eef5fa; --secondary: #a3b3c2; --accent: #5cc8ff; --accent-hover: #84d7ff; --on-accent: #041624; }
  body { font: 16px/1.5 "IBM Plex Sans", system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--text); color-scheme: dark; }
  main { max-width: 32rem; padding: 2rem; }
  .mark { display: block; margin: 0 0 1.25rem; }
  h1 { font-size: 1.75rem; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; margin: 0 0 1rem; }
  p { margin: 0 0 1rem; color: var(--secondary); }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.5rem 0; }
  a.button, button { font: inherit; font-weight: 500; line-height: 1.5; padding: .5rem 1rem; border-radius: .5rem; border: 0; background: var(--raised); color: var(--text); text-decoration: none; cursor: pointer; transition: background-color 120ms ease; }
  a.button:hover, button:hover { background: var(--highlight); }
  a.button.primary { background: var(--accent); color: var(--on-accent); }
  a.button.primary:hover { background: var(--accent-hover); }
  a.button:focus-visible, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  code { display: block; word-break: break-all; padding: .75rem; background: var(--surface); border-radius: .5rem; font-size: .875rem; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <img class="mark" src="icon.svg" alt="" width="40" height="40">
  <h1>Join an OpenStream room</h1>
  <section id="opening">
    <p>Opening OpenStream…</p>
  </section>
  <section id="fallback" hidden>
    <p>If OpenStream did not open, install it and click the link again, or paste the ticket into the start screen.</p>
    <div class="actions">
      <a class="button primary" href="https://github.com/gtkacz/openstream/releases/latest">Download OpenStream</a>
      <a class="button" id="retry" href="#">Open in OpenStream</a>
      <button id="copy" type="button">Copy ticket</button>
    </div>
    <code id="ticket"></code>
  </section>
  <section id="no-ticket" hidden>
    <p>This link carries no ticket. Ask someone in the room for a new one.</p>
    <div class="actions">
      <a class="button primary" href="https://github.com/gtkacz/openstream/releases/latest">Download OpenStream</a>
    </div>
  </section>
</main>
<script>
  // Everything after # stays in the browser: the ticket never reaches the server this page is on.
  let ticket = "";
  try { ticket = decodeURIComponent(location.hash.slice(1)); } catch (_) { ticket = ""; }
  const looksLikeTicket = /^brp[a-z2-7]+$/i.test(ticket);
  const show = (id) => { for (const s of document.querySelectorAll("section")) { s.hidden = s.id !== id; } };
  if (!looksLikeTicket) {
    show("no-ticket");
  } else {
    const schemeLink = "brp://join/" + ticket;
    document.getElementById("retry").href = schemeLink;
    document.getElementById("ticket").textContent = ticket;
    const copy = document.getElementById("copy");
    copy.addEventListener("click", () => navigator.clipboard.writeText(ticket).then(() => {
      copy.textContent = "Copied";
      setTimeout(() => { copy.textContent = "Copy ticket"; }, 1500);
    }));
    location.href = schemeLink;
    // A browser with a handler leaves this page; one without stays and gets the fallback.
    setTimeout(() => show("fallback"), 1500);
  }
</script>
</body>
</html>
